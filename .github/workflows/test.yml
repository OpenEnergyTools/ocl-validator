name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage-report
          path: coverage/

      - name: Generate coverage summary
        run: |
          # Extract line coverage percentage from summary
          COVERAGE=$(grep "All files" coverage/coverage-summary.json | grep -oP '\d+\.\d+' || echo "0")
          echo "Coverage: $COVERAGE%"
          
          # Create a simple coverage badge (for now, we'll use a static approach)
          # In practice, you might use a service like Codecov or Coveralls for dynamic badges
          echo "Coverage percentage: $COVERAGE"